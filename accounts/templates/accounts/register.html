<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در لقمه</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-green-600 mb-2">
                لقمه
            </h1>
            <p class="text-gray-500">
                به لقمه خوش آمدید!
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-2">
                ایجاد حساب کاربری
            </h2>

            <p class="text-sm text-gray-500 mb-6">
                برای سفارش غذای مورد علاقه‌تان ثبت‌نام کنید.
            </p>

            <form method="POST" class="space-y-4">
                {% csrf_token %}

                {% for field in form %}
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <p class="text-red-500 text-xs mt-1">
                                {{ field.errors }}
                            </p>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition duration-200">
                    ثبت‌نام
                </button>
            </form>

            <div class="text-center mt-6 text-sm text-gray-600">
                قبلاً ثبت‌نام کرده‌اید؟
                <a href="{% url 'accounts:login' %}"
                   class="text-green-600 font-bold hover:text-green-700">
                    وارد شوید
                </a>
            </div>

        </div>

        <form method="POST" action="{% url 'accounts:logout' %}" class="text-center mt-5">
            {% csrf_token %}
            <button type="submit" class="text-sm text-gray-400 hover:text-red-500">
                خروج از حساب کاربری
            </button>
        </form>

    </div>

</body>
</html>
