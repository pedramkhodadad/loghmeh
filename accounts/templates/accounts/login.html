<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به لقمه</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-green-600 mb-2">
                لقمه
            </h1>
            <p class="text-gray-500">
                خوش برگشتی!
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-2">
                ورود به حساب کاربری
            </h2>

            <p class="text-sm text-gray-500 mb-6">
                برای ادامه، اطلاعات حساب خود را وارد کنید.
            </p>

            {% if error %}
                <div class="bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-5">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        نام کاربری
                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100 transition"
                        placeholder="نام کاربری خود را وارد کنید"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        رمز عبور
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100 transition"
                        placeholder="رمز عبور خود را وارد کنید"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition duration-200"
                >
                    ورود
                </button>

            </form>

            <div class="text-center mt-6 text-sm text-gray-600">
                حساب کاربری ندارید؟
                <a href="{% url 'accounts:register' %}"
                   class="text-green-600 font-bold hover:text-green-700">
                    ثبت‌نام کنید
                </a>
            </div>

        </div>

    </div>

</body>
</html>
