
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت رستوران</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        a, button {
            padding: 8px 14px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn {
            background: #198754;
            color: white;
        }

        .delete {
            background: #dc3545;
            color: white;
        }

        .edit {
            background: #0d6efd;
            color: white;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        .restaurant {
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        img {
            max-width: 250px;
            border-radius: 8px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>پنل مدیریت رستوران</h1>

    <hr>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
